<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>箸にも棒にもかからない</title><link rel="stylesheet" href="css/style.css"></head>
<body><main id="game"><header><span>おひるの定食屋</span><button id="sound" aria-label="効果音を切り替え">音 ON</button></header><div class="scene" id="scene"><div class="wall"><span class="menu">本日の定食<br><b>焼き魚</b><br>ごはん・味噌汁</span><div class="window"></div></div><div id="staff" class="staff" data-gaze="normal"><div class="hair"></div><div class="face"><span class="eyes">・ ・</span><i></i></div><div class="body"><div class="apron"></div></div><span class="staff-note" id="staffNote"></span></div><div class="counter"></div><div class="table"><img class="meal" src="assets/images/meal.svg" alt="焼き魚、ごはん、味噌汁の定食"><div id="pile"></div></div><div id="sparkles"></div><div id="held"></div><div class="hand left"></div><div class="hand right"></div><div id="callout" role="status"></div></div><section class="controls"><div class="count">使えない箸 <strong id="count">0</strong> 膳<span id="guide">長押し → 離す</span></div><div class="meter"><div id="fill"></div></div><div class="meter-label"><span>そっと</span><span>力いっぱい</span></div><button id="press">長押しして、割る</button><p id="hint">ちょうどいい力は、箸が知っている。</p></section><div class="overlay" id="title"><div class="title-card"><span class="eyebrow">割り箸、それだけなのに。</span><h1>箸にも棒にも<br>かからない<span>。</span></h1><div class="title-sticks">╱ ╱</div><p>きれいに割って。</p><button id="start">タップしてはじめる <span>→</span></button><small>長押しして、指を離す。それだけ。</small></div></div><div class="overlay hidden" id="result"><div class="result-card"><span class="eyebrow">いただきます、の前に。</span><h2>やっと<br>食べられる。</h2><dl><dt>犠牲になった割り箸</dt><dd><b id="total">0</b> 膳</dd><dt>お店への申し訳なさ</dt><dd><b id="guilt">0</b>％</dd></dl><p id="comment"></p><button id="again">もう一度 <span>↻</span></button></div></div></main><script src="js/game.js"></script></body></html>
